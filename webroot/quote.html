<!DOCTYPE html>
<html lang="en">    
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Screen Snaps</title>
  </head>

<body>
     <div class="quote-container">
      <h1>Screen Snaps</h1>
      <p class="subtitle"> What movie is this from? </p>
      <br>
      <div class="quote-box" id="movieQuote">
        <p></p>
        <br>
 
    </div>
 
   <p class="subtitle">Enter your guess below:</p>
      <div class="input-box">
        <input type="text" id="quoteInput" placeholder="Enter movie title guesses here!" />
        <button onclick="checkQuote()" class="submit-btn btn" role="button" id="checkQuote">
          Submit
        </button>
      </div>

      <div class="result-box">
        <p class="guessesLeft" id="guessesLeft"></p> </p>        
        <p class="message" id="warningMessage"></p>
      </div>

         <div id="youLoseModal">
        <div class="modal-content">
        <p class="message" id="message"></p>
      </div>
      </div>

        <script type="application/javascript" src="quotes.js"></script>
    </body>
</html>
